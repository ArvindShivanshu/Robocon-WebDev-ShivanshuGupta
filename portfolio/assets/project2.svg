  <rect x="35" y="65" width="530" height="70" rx="10" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
  <text x="60" y="98" fill="#f4f4f5" font-family="sans-serif" font-size="16" font-weight="bold">Hi, I'm Shivanshu Gupta</text>
