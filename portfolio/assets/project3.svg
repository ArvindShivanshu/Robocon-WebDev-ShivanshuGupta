<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="activeBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#p3Bg)" />

  <!-- Window Header -->
  <rect width="600" height="40" rx="16" fill="#064e3b" />
  <rect y="25" width="600" height="15" fill="#064e3b" />
  <circle cx="30" cy="20" r="6" fill="#ef4444" />
  <circle cx="50" cy="20" r="6" fill="#eab308" />
  <circle cx="70" cy="20" r="6" fill="#22c55e" />
  <text x="300" y="25" fill="#6ee7b7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">algo-visualizer.cpp/pathfinder</text>

  <!-- Controls Bar -->
  <rect x="30" y="60" width="540" height="45" rx="8" fill="#065f46" opacity="0.6" />
  <text x="45" y="87" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold">ALGORITHM: QuickSort &amp; Dijkstra A*</text>
  <rect x="420" y="70" width="65" height="25" rx="4" fill="#047857" />
  <text x="452" y="86" fill="#ecfdf5" font-family="sans-serif" font-size="11" text-anchor="middle">SORT</text>
  <rect x="495" y="70" width="65" height="25" rx="4" fill="#059669" />
  <text x="527" y="86" fill="#ecfdf5" font-family="sans-serif" font-size="11" text-anchor="middle">RESET</text>

  <!-- Visualizer Bars -->
  <g transform="translate(45, 290) scale(1, -1)">
    <rect x="0" y="0" width="22" height="60" rx="4" fill="url(#barGrad)" />
    <rect x="32" y="0" width="22" height="110" rx="4" fill="url(#barGrad)" />
    <rect x="64" y="0" width="22" height="40" rx="4" fill="url(#barGrad)" />
    <rect x="96" y="0" width="22" height="140" rx="4" fill="url(#barGrad)" />
    <rect x="128" y="0" width="22" height="85" rx="4" fill="url(#barGrad)" />
    <rect x="160" y="0" width="22" height="170" rx="4" fill="url(#activeBarGrad)" />
    <rect x="192" y="0" width="22" height="120" rx="4" fill="url(#activeBarGrad)" />
    <rect x="224" y="0" width="22" height="50" rx="4" fill="url(#barGrad)" />
    <rect x="256" y="0" width="22" height="155" rx="4" fill="url(#barGrad)" />
    <rect x="288" y="0" width="22" height="95" rx="4" fill="url(#barGrad)" />
    <rect x="320" y="0" width="22" height="75" rx="4" fill="url(#barGrad)" />
    <rect x="352" y="0" width="22" height="130" rx="4" fill="url(#barGrad)" />
    <rect x="384" y="0" width="22" height="160" rx="4" fill="url(#barGrad)" />
    <rect x="416" y="0" width="22" height="45" rx="4" fill="url(#barGrad)" />
    <rect x="448" y="0" width="22" height="105" rx="4" fill="url(#barGrad)" />
    <rect x="480" y="0" width="22" height="80" rx="4" fill="url(#barGrad)" />
  </g>

  <!-- Legend -->
  <text x="45" y="325" fill="#9ca3af" font-family="monospace" font-size="11">Time Complexity: O(N log N) | Comparisons: 1,842 | Swaps: 320</text>
